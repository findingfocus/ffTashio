server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/wasm image/svg+xml;
	gzip_vary on;

	# Cache-busted SvelteKit assets (filenames contain hashes)
	location /_app/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# Large game / media assets
	location ~* \.(wasm|love|data|mp4|webm|webp|png|jpg|jpeg|gif|ico|svg)$ {
		expires 7d;
		add_header Cache-Control "public";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
